name: Check CSS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: css-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Build CSS
        run: composer css:build

      - name: Check compiled CSS is up to date
        run: |
          if ! git diff --exit-code --stat assets/styles.css; then
            echo "::error file=assets/styles.css::assets/styles.css is not up to date with its sources: run 'composer css:build' and commit the result."
            exit 1
          fi
