# Docs default config
github:
  branch: main
  path: pages
footer: Copyright © %author%
sidebar:
  collapsed: false # collapse the groups of the navigation, except the current one
language_cookie: false # name of a cookie storing the language chosen with the selector (e.g. `nf_lang` for Netlify redirects)
lastupdated: false # display the page date as "Last updated on" (the `updated` front matter variable is always displayed)
manifest:
  background_color: '#1447E6'
  theme_color: '#1447E6'
  theme_color_dark: '#1C398E'
serviceworker:
  enabled: false
highlightjs:
  version: '11.12.0'
tocbot:
  version: '4.36.8'
mermaid:
  version: '11.17.2'

# Cecil config for Docs
pages:
  pagination:
    enabled: false
  sortby: weight
  body:
    highlight:
      enabled: true
    images:
      class: "dark:brightness-90"
      resize:
        enabled: true
      webp:
        enabled: true
      responsive:
        enabled: true
      caption:
        enabled: true
    links:
      embed:
        enabled: true
