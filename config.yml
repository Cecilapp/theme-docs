# Docs default config
github:
  url: https://github.com/cecilapp/statidocs
  repo: https://github.com/cecilapp/statidocs
  branch: main
footer: Copyright © %author%
manifest:
  background_color: '#1447E6'
  theme_color: '#1447E6'
  theme_color_dark: '#1C398E'
serviceworker:
  enabled: false
docsearch:
  enabled: false
  version: '3'
highlightjs:
  version: '11.12.0'
tocbot:
  version: '4.36.8'
mermaid:
  version: '11.17.2'

# Cecil config for Docs
pages:
  pagination:
    enabled: false
  sortby: weight
  body:
    highlight:
      enabled: true
    images:
      class: "dark:brightness-90"
      resize:
        enabled: true
      webp:
        enabled: true
      responsive:
        enabled: true
      caption:
        enabled: true
    links:
      embed:
        enabled: true
